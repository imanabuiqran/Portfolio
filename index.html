        <div id="contact">
            <center>
                <h1>
                    Contact
                </h1>
                <p>
                    I'd love to hear how I can contribute to your story. Drop me a line on<br>
                    this contact form or directly to my email, I will happily get back to you.
                </p>
                <p id="contact-email">
                    iman.iqran@gmail.com
                </p>
                <div id="contact-wrap">
                    <form id="contact-form" novalidate>
                        <div class="form-row">
                            <div class="field">
                                <label for="first-name">First Name</label>
                                <input type="text" id="first-name" name="firstName" autocomplete="given-name" required>
                                <span class="field-error"></span>
                            </div>
                            <div class="field">
                                <label for="last-name">Last Name</label>
                                <input type="text" id="last-name" name="lastName" autocomplete="family-name" required>
                                <span class="field-error"></span>
                            </div>
                        </div>
        
                        <div class="field full">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" autocomplete="email" required>
                            <span class="field-error"></span>
                        </div>
        
                        <div class="field full">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="7" required></textarea>
                            <span class="field-error"></span>
                        </div>
        
                        <div id="form-footer">
                            <p id="form-status" role="status" aria-live="polite"></p>
                            <button type="submit" id="send-btn">Send</button>
                        </div>
                    </form>
                </div>
            </center>
        </div>
        <script src="assets/scripts/gradient.js"></script>
        <script src="assets/scripts/contact.js"></script>
    </body>
